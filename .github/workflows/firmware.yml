name: Build & Release Firmware

on:
  pull_request:
    paths:
      - 'firmware/**'
  push:
    branches: [latest]
    paths:
      - 'firmware/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware (both halves)
        run: |
          cd firmware
          docker build -t elora-firmware .
          mkdir -p output
          docker run --rm -v "$(pwd)/output:/output" elora-firmware \
            sh -c '
              qmk compile -kb splitkb/halcyon/elora/rev2 -km denis -e HLC_TFT_DISPLAY=1 &&
              UF2=$(find / -name "*.uf2" -not -path "/proc/*" -not -path "/sys/*" -not -path "/output/*" 2>/dev/null | head -1) &&
              cp "$UF2" /output/elora_left_display.uf2 &&
              rm "$UF2" &&
              qmk compile -kb splitkb/halcyon/elora/rev2 -km denis -e HLC_CIRQUE_TRACKPAD=1 &&
              UF2=$(find / -name "*.uf2" -not -path "/proc/*" -not -path "/sys/*" -not -path "/output/*" 2>/dev/null | head -1) &&
              cp "$UF2" /output/elora_right_trackpad.uf2
            '

      - name: Get next semantic version
        if: github.event_name == 'push'
        id: version
        run: |
          # Fetch all tags
          git fetch --tags

          # Find latest semver tag
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "Latest tag: $LATEST"

          # Parse major.minor.patch
          VERSION="${LATEST#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Determine bump from merge commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -qiE '(^|\s)breaking(\s|:)|major:'; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif echo "$COMMIT_MSG" | grep -qiE 'feat(\(|:)|minor:'; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New tag: $NEW_TAG"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create release with firmware artifacts
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" \
            firmware/output/elora_left_display.uf2 \
            firmware/output/elora_right_trackpad.uf2 \
            --title "Firmware $TAG" \
            --generate-notes
