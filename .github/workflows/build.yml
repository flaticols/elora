name: Build ZMK firmware

on:
  pull_request:
    paths: [build.yaml, config/**, zephyr/**, .github/workflows/build.yml]
  push:
    paths: [build.yaml, config/**, zephyr/**, .github/workflows/build.yml]
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/latest'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware

      - name: Next semantic version
        id: version
        run: |
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          VERSION="${LATEST:-v0.0.0}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION#v}"
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -qiE '(^|\s)breaking(\s|:)|major:'; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$COMMIT_MSG" | grep -qiE 'feat(\(|:)|minor:'; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          echo "tag=v${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" firmware/*.uf2 \
            --title "Firmware ${{ steps.version.outputs.tag }}" \
            --generate-notes
